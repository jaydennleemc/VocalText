name: CI

on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ dev ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "26.0"
            deployment_target: "15.5"
    runs-on: macos-26
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0
    
    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
        xcodebuild -version
        
    - name: Cache Swift Package Manager dependencies
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build and Test
      run: |
        # Build the project first to generate the app bundle
        xcodebuild -project Typeless.xcodeproj \
          -scheme Typeless \
          -configuration Release \
          -derivedDataPath DerivedData \
          -destination "platform=macOS,arch=arm64" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          clean build
          
        # Verify the app was built successfully
        if [ ! -d "DerivedData/Build/Products/Release/Typeless.app" ]; then
          echo "❌ Build failed - app bundle not found"
          exit 1
        fi
        echo "✅ Build successful"
        
    - name: Get app version
      run: |
        # Get the app version from the project
        APP_VERSION=$(defaults read "$PWD/DerivedData/Build/Products/Release/Typeless.app/Contents/Info.plist" CFBundleShortVersionString)
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "App version: $APP_VERSION"
        
        # Get build number
        BUILD_NUMBER=$(defaults read "$PWD/DerivedData/Build/Products/Release/Typeless.app/Contents/Info.plist" CFBundleVersion)
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
        echo "Build number: $BUILD_NUMBER"
    
    - name: Create build artifacts directory
      run: mkdir -p build-artifacts
    
    - name: Copy app bundle to artifacts directory
      run: |
        cp -R DerivedData/Build/Products/Release/Typeless.app build-artifacts/
        # Also copy dSYM if it exists
        if [ -d "DerivedData/Build/Products/Release/Typeless.app.dSYM" ]; then
          cp -R DerivedData/Build/Products/Release/Typeless.app.dSYM build-artifacts/
        fi
    
    - name: Create ZIP archive
      run: |
        cd build-artifacts
        zip -r "Typeless-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}.zip" "Typeless.app" "Typeless.app.dSYM" 2>/dev/null || zip -r "Typeless-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}.zip" "Typeless.app"
        echo "Created: Typeless-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}.zip"
    
    - name: Upload ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Typeless-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}.zip
        path: build-artifacts/Typeless-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}.zip
        retention-days: 30

  release:
    needs: build
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: Typeless-${{ env.APP_VERSION }}-build${{ env.BUILD_NUMBER }}.zip
        path: build-artifacts/
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Generate Release Notes
      run: |
        # Generate release notes based on commits since last tag
        echo "## Typeless v${{ steps.version.outputs.version }}" > release_notes.md
        echo "" >> release_notes.md
        echo "### Build Information" >> release_notes.md
        echo "- Version: ${{ env.APP_VERSION }}" >> release_notes.md
        echo "- Build: ${{ env.BUILD_NUMBER }}" >> release_notes.md
        echo "- Target: macOS 15.5+" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Changes" >> release_notes.md
        echo "View [commits](https://github.com/${{ github.repository }}/compare/${{ github.event.base_ref }}...${{ github.sha }}) for details." >> release_notes.md
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Typeless v${{ steps.version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: build-artifacts/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}