name: CI

on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ dev ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - xcode: "26.0"
            deployment_target: "15.5"
    runs-on: macos-26
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0
    
    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
        xcodebuild -version
        
    - name: Cache Swift Package Manager dependencies
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Build and Test
      run: |
        # Build the project first to generate the app bundle
        xcodebuild -project Typeless.xcodeproj \
          -scheme Typeless \
          -configuration Release \
          -derivedDataPath DerivedData \
          -destination "platform=macOS,arch=arm64" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          clean build
          
        # Verify the app was built successfully
        if [ ! -d "DerivedData/Build/Products/Release/Typeless.app" ]; then
          echo "❌ Build failed - app bundle not found"
          exit 1
        fi
        echo "✅ Build successful"
        
    - name: Get app version
      id: version
      run: |
        # Get the app version from the project
        APP_VERSION=$(defaults read "$PWD/DerivedData/Build/Products/Release/Typeless.app/Contents/Info.plist" CFBundleShortVersionString)
        echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "APP_VERSION: $APP_VERSION"
        
        # Get build number
        BUILD_NUMBER=$(defaults read "$PWD/DerivedData/Build/Products/Release/Typeless.app/Contents/Info.plist" CFBundleVersion)
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "BUILD_NUMBER: $BUILD_NUMBER"
    
    - name: Create DMG
      run: |
        APP_VERSION=${{ steps.version.outputs.app_version }}
        BUILD_NUMBER=${{ steps.version.outputs.build_number }}
        
        # Create a temporary directory for DMG contents
        mkdir -p dmg-staging/Typeless.app
        cp -R DerivedData/Build/Products/Release/Typeless.app dmg-staging/
        
        # Also copy dSYM if it exists
        if [ -d "DerivedData/Build/Products/Release/Typeless.app.dSYM" ]; then
          cp -R DerivedData/Build/Products/Release/Typeless.app.dSYM dmg-staging/
        fi
        
        # Create DMG using hdiutil
        hdiutil create -volname "Typeless" \
          -volicon "Typeless.app/Contents/Resources/AppIcon.icns" \
          -fs HFS+ \
          -srcfolder dmg-staging \
          -ov -format UDBZ \
          "Typeless-$APP_VERSION.dmg"
        
        echo "Created: Typeless-$APP_VERSION.dmg"
    
    - name: Upload DMG as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Typeless-${{ steps.version.outputs.app_version }}.dmg
        path: Typeless-${{ steps.version.outputs.app_version }}.dmg
        retention-days: 30

  release:
    needs: build
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: Typeless-${{ needs.build.outputs.app_version }}.dmg
        path: build-artifacts/
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Generate Release Notes
      run: |
        echo "## Typeless v${{ steps.version.outputs.version }}" > release_notes.md
        echo "" >> release_notes.md
        echo "### Build Information" >> release_notes.md
        echo "- Version: ${{ needs.build.outputs.app_version }}" >> release_notes.md
        echo "- Build: ${{ needs.build.outputs.build_number }}" >> release_notes.md
        echo "- Target: macOS 15.5+" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Changes" >> release_notes.md
        echo "View [commits](https://github.com/${{ github.repository }}/compare/${{ github.event.base_ref }}...${{ github.sha }}) for details." >> release_notes.md
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Typeless v${{ steps.version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: build-artifacts/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}